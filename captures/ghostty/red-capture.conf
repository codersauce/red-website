# Ghostty settings for recording Red's inline Markdown images, matched to the
# VHS clips (captures/header.tape): same font, size, colors, and 1600x900 frame.
# VHS cannot draw terminal graphics, so image scenes are recorded here.
font-family = "Berkeley Mono"
font-family = "Symbols Nerd Font Mono"
font-size = 15
adjust-cell-height = 25%
window-width = 157
window-height = 35
window-padding-x = 0
window-padding-y = 0
window-padding-balance = true
maximize = false
fullscreen = false
window-save-state = never
auto-update = off
macos-titlebar-style = hidden
cursor-style-blink = false
macos-option-as-alt = true
shell-integration = none
confirm-close-surface = false
background = #101014
foreground = #D8D8DE
cursor-color = #D8D8DE
selection-background = #2A2A33
palette = 0=#101014
palette = 1=#FF5A5F
palette = 2=#8CC68C
palette = 3=#E8C07A
palette = 4=#8FB8F0
palette = 5=#C9A0F0
palette = 6=#7FD1D1
palette = 7=#D8D8DE
palette = 8=#5A5A66
palette = 9=#FF7A7E
palette = 10=#A6D8A6
palette = 11=#F0D29A
palette = 12=#A9C9F5
palette = 13=#D8B8F5
palette = 14=#9FE0E0
palette = 15=#FFFFFF
